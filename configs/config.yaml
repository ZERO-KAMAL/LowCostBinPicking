# Main configuration for the 2D bin picking prototype.

camera:
  index: 0              # change if your webcam is not /dev/video0 (try 1, 2 ...)
  width: 1280
  height: 720
  flip_horizontal: false

workspace:
  # ROI as fractions of the full frame: [x, y, width, height]
  # Example: start at 15% from left, 10% from top, cover 70% width, 80% height.
  # roi: [0.15, 0.10, 0.70, 0.80]
  # roi: [0.25, 0.25, 0.50, 0.50]
   roi: [0.28, 0.20, 0.36, 0.64]

model:
  yolo_weights: models/best.pt
  confidence: 0.5
  image_size: 640

depth:
  enabled: true                 # set true only after Depth Anything V2 setup (README section 11)
  method: depth_anything_v2      # none | depth_anything_v2
  model_path: external/models/depth_anything_v2_vits.pth
  # model_path: external/models/depth_anything_v2_vits.pth
  encoder: vits                  # vits | vitb | vitl
  every_n_frames: 5              # run depth only every Nth frame to keep live FPS usable

pick_selection:
  min_mask_area_px: 400          # ignore tiny noise masks
  area_weight: 0.3
  confidence_weight: 0.4
  depth_weight: 0.3
  # Note: Depth Anything V2 outputs relative inverse depth (larger = closer to camera).
  # With normalized depth, a higher depth_score means "more on top" in most setups.
 

calibration:
  path: configs/calibration.npz   # created by calibrate.py; enables mm output for the robot